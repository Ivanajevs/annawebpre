<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – St. Anna Merch</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />

  <!-- Supabase CDN (EmailJS entfernt) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    /* ── CSS-Variablen (passend zu style.css) ───────────────────── */
    :root {
      --bg:        #eb3d3d;
      --bg2:       #660303;
      --bg3:       #e9d2d2;
      --gold:      #ff0000;
      --gold-dim:  #491616;
      --text:      #000000;
      --text-muted:#f00000;
      --radius:    10px;
      --green:     #22c55e;
      --red:       #ef4444;
      --border:    rgba(232,160,32,.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      color: var(--gold);
      letter-spacing: .04em;
    }
    .logo-sub {
      font-size: .75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .admin-badge {
      margin-left: auto;
      font-size: .7rem;
      background: var(--gold);
      color: #000;
      font-weight: 600;
      padding: .25rem .7rem;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    #logoutBtn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      padding: .4rem .9rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
    }
    #logoutBtn:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Login Screen ────────────────────────────────────────────── */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 70px);
      padding: 2rem;
    }
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .login-card h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: var(--gold);
      letter-spacing: .04em;
    }
    .login-card label {
      font-size: .78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .1em;
      display: block;
      margin-bottom: .4rem;
    }
    .login-card input {
      width: 100%;
      padding: .7rem 1rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }
    .login-card input:focus { border-color: var(--gold); }
    .login-error {
      font-size: .83rem;
      color: var(--red);
      min-height: 1.2rem;
    }
    .btn-login {
      width: 100%;
      padding: .8rem;
      background: var(--gold);
      border: none;
      border-radius: var(--radius);
      color: #000;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .06em;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-login:hover { background: var(--gold-dim); }

    /* ── Dashboard ───────────────────────────────────────────────── */
    #dashboard {
      display: none;
      padding: 2rem;
    }
    .dash-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }
    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      color: var(--gold);
      letter-spacing: .04em;
    }
    .order-count {
      font-size: .8rem;
      color: var(--text-muted);
    }
    .btn-refresh {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      padding: .4rem .9rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
    }
    .btn-refresh:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Tabelle ─────────────────────────────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    thead th {
      background: var(--bg3);
      color: var(--text-muted);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 600;
      padding: .85rem 1.1rem;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid rgba(232,160,32,.07);
      transition: background .15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(232,160,32,.04); }
    tbody td {
      padding: .85rem 1.1rem;
      vertical-align: middle;
      white-space: nowrap;
    }
    .order-id-btn {
      background: none;
      border: none;
      color: var(--gold);
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 0;
    }
    .order-id-btn:hover { color: var(--gold-dim); }

    /* ── Status-Badges (klickbar) ────────────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .3rem .8rem;
      border-radius: 99px;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: opacity .2s, transform .1s;
      user-select: none;
    }
    .status-badge:hover { opacity: .85; }
    .status-badge:active { transform: scale(.95); }
    .status-badge.on  { background: rgba(34,197,94,.15);  color: var(--green); }
    .status-badge.off { background: rgba(239,68,68,.12);  color: var(--red);   }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .date-cell { color: var(--text-muted); font-size: .8rem; }

    /* ── Loading / Empty ─────────────────────────────────────────── */
    .table-state {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: .9rem;
    }

    /* ── Modal Overlay (shared) ──────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }

    /* ── Detail Modal ────────────────────────────────────────────── */
    .detail-modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .detail-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: .9rem;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .detail-close:hover { border-color: var(--gold); color: var(--gold); }
    .detail-modal h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      color: var(--gold);
      letter-spacing: .04em;
      margin-bottom: 1.5rem;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .8rem 1.5rem;
    }
    .detail-item { display: flex; flex-direction: column; gap: .2rem; }
    .detail-label {
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--text-muted);
    }
    .detail-value {
      font-size: .92rem;
      color: var(--text);
      font-weight: 600;
      word-break: break-word;
    }
    .detail-item.full { grid-column: 1 / -1; }
    .detail-divider {
      grid-column: 1 / -1;
      border: none;
      border-top: 1px solid var(--border);
      margin: .4rem 0;
    }

    /* ── Bestätigungs-Modal ──────────────────────────────────────── */
    .confirm-modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 1.4);
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      position: relative;
      animation: slideUp .22s ease;
      box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(232,160,32,.08);
    }

    .confirm-modal::before {
      content: '';
      position: absolute;
      top: 0; left: 2rem; right: 2rem;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 0 0 2px 2px;
    }

    .confirm-modal-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(232,160,32,.12);
      border: 1px solid rgba(232,160,32,.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
    }

    .confirm-modal h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.45rem;
      color: var(--gold);
      letter-spacing: .04em;
      margin-bottom: .5rem;
    }

    .confirm-modal p {
      font-size: .88rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 1.4rem;
    }

    .confirm-modal p strong {
      color: var(--text);
      font-weight: 600;
    }

    .confirm-checkbox-row {
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .8rem 1rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1.6rem;
      cursor: pointer;
      transition: border-color .2s;
    }
    .confirm-checkbox-row:hover { border-color: rgba(232,160,32,.4); }

    .confirm-checkbox-row input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 17px; height: 17px;
      border: 1.5px solid var(--text-muted);
      border-radius: 4px;
      background: var(--bg);
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: border-color .2s, background .2s;
    }
    .confirm-checkbox-row input[type="checkbox"]:checked {
      background: var(--gold);
      border-color: var(--gold);
    }
    .confirm-checkbox-row input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      top: 2px; left: 5px;
      width: 5px; height: 9px;
      border: 2px solid #000;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }
    .confirm-checkbox-label {
      font-size: .82rem;
      color: var(--text);
      line-height: 1.4;
      cursor: pointer;
      user-select: none;
    }
    .confirm-checkbox-label small {
      display: block;
      color: var(--text-muted);
      font-size: .73rem;
      margin-top: .15rem;
    }

    .confirm-actions {
      display: flex;
      gap: .75rem;
    }
    .btn-cancel {
      flex: 1;
      padding: .72rem 1rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
    }
    .btn-cancel:hover { border-color: rgba(255,255,255,.2); color: var(--text); }

    .btn-confirm {
      flex: 2;
      padding: .72rem 1rem;
      background: var(--gold);
      border: none;
      color: #000;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: .06em;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .2s, opacity .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }
    .btn-confirm:hover { background: var(--gold-dim); }
    .btn-confirm:disabled { opacity: .55; cursor: not-allowed; }

    .btn-confirm .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    .btn-confirm.loading .spinner { display: block; }
    .btn-confirm.loading .btn-confirm-label { opacity: .6; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .confirm-feedback {
      margin-top: .85rem;
      font-size: .78rem;
      min-height: 1.1rem;
      text-align: center;
    }
    .confirm-feedback.error { color: var(--red); }
    .confirm-feedback.warn  { color: var(--gold); }

    @media (max-width: 600px) {
      .detail-grid { grid-template-columns: 1fr; }
      #dashboard { padding: 1rem; }
      .confirm-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="logo-main">St. Anna</div>
      <div class="logo-sub">Merch Shop</div>
    </div>
    <span class="admin-badge">Admin</span>
    <button id="logoutBtn" hidden>Abmelden</button>
  </header>

  <!-- ══════════════  LOGIN  ══════════════ -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>Admin-Login</h2>
      <div>
        <label for="loginUser">Benutzername</label>
        <input type="text" id="loginUser" autocomplete="username" placeholder="admin" />
      </div>
      <div>
        <label for="loginPass">Passwort</label>
        <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <p class="login-error" id="loginError"></p>
      <button class="btn-login" id="loginBtn">Anmelden</button>
    </div>
  </div>

  <!-- ══════════════  DASHBOARD  ══════════════ -->
  <div id="dashboard">
    <div class="dash-header">
      <h1>Bestellungen</h1>
      <span class="order-count" id="orderCount"></span>
      <button class="btn-refresh" id="refreshBtn">↻ Aktualisieren</button>
    </div>

    <div class="table-wrap">
      <table id="ordersTable">
        <thead>
          <tr>
            <th>Bestell-ID</th>
            <th>Produkt</th>
            <th>Kunde</th>
            <th>Bezahlt</th>
            <th>Bestellt</th>
            <th>Ausgeliefert</th>
            <th>Datum</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="7" class="table-state">Lade Bestellungen…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ══════════════  DETAIL MODAL  ══════════════ -->
  <div class="modal-overlay" id="detailOverlay">
    <div class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button class="detail-close" id="detailClose" aria-label="Schließen">✕</button>
      <h3 id="detailTitle">Bestellung</h3>
      <div class="detail-grid" id="detailGrid"></div>
    </div>
  </div>

  <!-- ══════════════  BESTÄTIGUNGS-MODAL  ══════════════ -->
  <div class="modal-overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-modal">
      <div class="confirm-modal-icon">✏️</div>
      <h3 id="confirmTitle">Status ändern</h3>
      <p id="confirmText">Möchtest du diesen Status wirklich ändern?</p>

      <label class="confirm-checkbox-row" for="emailCheckbox">
        <input type="checkbox" id="emailCheckbox" checked />
        <span class="confirm-checkbox-label">
          Kunden per E-Mail benachrichtigen
          <small id="confirmEmailHint">Die E-Mail wird an die hinterlegte Adresse gesendet.</small>
        </span>
      </label>

      <div class="confirm-actions">
        <button class="btn-cancel" id="confirmCancelBtn">Abbrechen</button>
        <button class="btn-confirm" id="confirmOkBtn">
          <span class="spinner"></span>
          <span class="btn-confirm-label">Bestätigen</span>
        </button>
      </div>

      <div class="confirm-feedback" id="confirmFeedback"></div>
    </div>
  </div>

  <script>
  /* ══════════════════════════════════════════════════════════════════
     KONFIGURATION
  ════════════════════════════════════════════════════════════════════ */
  const SUPABASE_URL      = "https://ilbfdcwlmucsyqepurcp.supabase.co";
  const SUPABASE_ANON_KEY = "sb_secret_spDO5OTEF73lQ1jOOqfehA_TaBRNTuY";
  const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/send-email`;

  /* Hilfstabelle: Feldname → Label (für Bestätigungstext im Modal) */
  const FIELD_META = {
    paid:      { label: "Bezahlt"      },
    ordered:   { label: "Bestellt"     },
    delivered: { label: "Ausgeliefert" },
  };

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ── Credentials (client-side guard – für schulinternes Tool ausreichend) ── */
  const ADMIN_USER = "admin";
  const ADMIN_PASS = "M1e2r3c4h5!";

  let isLoggedIn = false;

  /* ══════════════════════════════════════════════════════════════════
     BESTÄTIGUNGS-MODAL – Zustand
  ════════════════════════════════════════════════════════════════════ */
  let pendingChange = null; // { badge, order, field, newValue }

  /* ── Modal öffnen ──────────────────────────────────────────────── */
  function openConfirmModal(badge, order, field, newValue) {
    pendingChange = { badge, order, field, newValue };

    const meta      = FIELD_META[field] || { label: field };
    const valueText = newValue ? "Ja" : "Nein";
    const email     = order.customer_email || "—";

    document.getElementById("confirmText").innerHTML =
      `Möchtest du den Status <strong>${meta.label}</strong> für<br>` +
      `<strong>${order.customer_name || "diesen Kunden"}</strong> auf ` +
      `<strong>${valueText}</strong> setzen?`;

    document.getElementById("confirmEmailHint").textContent =
      email !== "—" ? `Wird an: ${email}` : "Keine E-Mail-Adresse hinterlegt.";

    document.getElementById("emailCheckbox").disabled = (email === "—");
    document.getElementById("confirmFeedback").textContent = "";
    document.getElementById("confirmFeedback").className   = "confirm-feedback";

    const okBtn = document.getElementById("confirmOkBtn");
    okBtn.disabled = false;
    okBtn.classList.remove("loading");

    document.getElementById("confirmOverlay").classList.add("active");
    document.body.style.overflow = "hidden";
  }

  /* ── Modal schließen ───────────────────────────────────────────── */
  function closeConfirmModal() {
    document.getElementById("confirmOverlay").classList.remove("active");
    document.body.style.overflow = "";
    pendingChange = null;
  }

  document.getElementById("confirmCancelBtn").addEventListener("click", closeConfirmModal);
  document.getElementById("confirmOverlay").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeConfirmModal();
  });

  /* ── Bestätigen ────────────────────────────────────────────────── */
  document.getElementById("confirmOkBtn").addEventListener("click", async () => {
    if (!pendingChange) return;

    const { badge, order, field, newValue } = pendingChange;
    const sendEmail = document.getElementById("emailCheckbox").checked;
    const okBtn     = document.getElementById("confirmOkBtn");
    const feedback  = document.getElementById("confirmFeedback");

    /* Lade-Zustand */
    okBtn.disabled = true;
    okBtn.classList.add("loading");
    feedback.textContent = "";

    /* 1 ── Supabase-Update ─────────────────────────────────────── */
    const { error: dbError } = await db
      .from("orders")
      .update({ [field]: newValue })
      .eq("id", order.id);

    if (dbError) {
      feedback.textContent = "Fehler beim Speichern: " + dbError.message;
      feedback.className   = "confirm-feedback error";
      okBtn.disabled       = false;
      okBtn.classList.remove("loading");
      return;
    }

    /* UI-Badge sofort aktualisieren */
    badge.classList.toggle("on",  newValue);
    badge.classList.toggle("off", !newValue);
    badge.innerHTML = `<span class="status-dot"></span>${newValue ? "Ja" : "Nein"}`;
    order[field] = newValue;

    /* 2 ── E-Mail über Supabase Edge Function → Mailjet ────────── */
    if (sendEmail && order.customer_email) {
      try {
        const res = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({
            action:    "status_update",
            order:     order,
            field:     field,
            new_value: newValue,
          }),
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(errText);
        }
      } catch (mailError) {
        /* E-Mail-Fehler sind nicht kritisch – Änderung wurde bereits gespeichert */
        console.error("Edge Function Fehler:", mailError);
        feedback.textContent =
          "Änderung gespeichert, aber E-Mail konnte nicht gesendet werden.";
        feedback.className   = "confirm-feedback warn";
        setTimeout(closeConfirmModal, 2800);
        okBtn.classList.remove("loading");
        return;
      }
    }

    /* Alles erfolgreich → Modal sofort schließen */
    closeConfirmModal();
  });

  /* ══════════════════════════════════════════════════════════════════
     LOGIN
  ════════════════════════════════════════════════════════════════════ */
  function attemptLogin() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;
    const err  = document.getElementById("loginError");

    if (user === ADMIN_USER && pass === ADMIN_PASS) {
      isLoggedIn = true;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboard").style.display   = "block";
      document.getElementById("logoutBtn").hidden = false;
      loadOrders();
    } else {
      err.textContent = "Falscher Benutzername oder falsches Passwort.";
      document.getElementById("loginPass").value = "";
    }
  }

  document.getElementById("loginBtn").addEventListener("click", attemptLogin);
  document.getElementById("loginPass").addEventListener("keydown", e => {
    if (e.key === "Enter") attemptLogin();
  });
  document.getElementById("loginUser").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("loginPass").focus();
  });

  /* ── Logout ────────────────────────────────────────────────────── */
  document.getElementById("logoutBtn").addEventListener("click", () => {
    isLoggedIn = false;
    document.getElementById("loginScreen").style.display = "";
    document.getElementById("dashboard").style.display   = "none";
    document.getElementById("logoutBtn").hidden = true;
    document.getElementById("loginUser").value = "";
    document.getElementById("loginPass").value = "";
    document.getElementById("loginError").textContent = "";
  });

  /* ══════════════════════════════════════════════════════════════════
     BESTELLUNGEN LADEN
  ════════════════════════════════════════════════════════════════════ */
  async function loadOrders() {
    const tbody = document.getElementById("ordersBody");
    tbody.innerHTML = `<tr><td colspan="7" class="table-state">Lade Bestellungen…</td></tr>`;

    const { data, error } = await db
      .from("orders")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      tbody.innerHTML = `<tr><td colspan="7" class="table-state" style="color:var(--red)">
        Fehler beim Laden: ${error.message}</td></tr>`;
      return;
    }

    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="table-state">Noch keine Bestellungen vorhanden.</td></tr>`;
      document.getElementById("orderCount").textContent = "";
      return;
    }

    document.getElementById("orderCount").textContent =
      `${data.length} Bestellung${data.length !== 1 ? "en" : ""}`;
    tbody.innerHTML = "";

    data.forEach(order => {
      const tr = document.createElement("tr");
      const dateStr = order.created_at
        ? new Date(order.created_at).toLocaleString("de-DE", {
            day: "2-digit", month: "2-digit", year: "numeric",
            hour: "2-digit", minute: "2-digit"
          })
        : "—";

      tr.innerHTML = `
        <td>
          <button class="order-id-btn" data-id="${order.id}">
            ${order.order_id || order.id.substring(0, 8) + "…"}
          </button>
        </td>
        <td>${order.product_name || "—"}</td>
        <td>${order.customer_name || "—"}</td>
        <td>${statusBadge("paid",      order.id, order.paid)}</td>
        <td>${statusBadge("ordered",   order.id, order.ordered)}</td>
        <td>${statusBadge("delivered", order.id, order.delivered)}</td>
        <td class="date-cell">${dateStr}</td>
      `;

      tr.querySelector(".order-id-btn").addEventListener("click", () => openDetail(order));

      tr.querySelectorAll(".status-badge").forEach(badge => {
        badge.addEventListener("click", () => toggleStatus(badge, order));
      });

      tbody.appendChild(tr);
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", loadOrders);

  /* ══════════════════════════════════════════════════════════════════
     STATUS-BADGE HTML
  ════════════════════════════════════════════════════════════════════ */
  function statusBadge(field, orderId, value) {
    const on = !!value;
    return `<button class="status-badge ${on ? "on" : "off"}"
               data-field="${field}" data-order-id="${orderId}">
               <span class="status-dot"></span>
               ${on ? "Ja" : "Nein"}
            </button>`;
  }

  /* ══════════════════════════════════════════════════════════════════
     STATUS TOGGLE
  ════════════════════════════════════════════════════════════════════ */
  function toggleStatus(badge, order) {
    const field    = badge.dataset.field;
    const newValue = badge.classList.contains("on") ? false : true;
    openConfirmModal(badge, order, field, newValue);
  }

  /* ══════════════════════════════════════════════════════════════════
     DETAIL MODAL
  ════════════════════════════════════════════════════════════════════ */
  function openDetail(order) {
    document.getElementById("detailTitle").textContent =
      `Bestellung ${order.order_id || "—"}`;

    const grid = document.getElementById("detailGrid");
    const rows = [
      { label: "Bestell-ID",       value: order.order_id || "—" },
      { label: "Datum",            value: order.created_at
          ? new Date(order.created_at).toLocaleString("de-DE")
          : "—" },
      { label: "divider" },
      { label: "Produkt",          value: order.product_name   || "—" },
      { label: "Preis",            value: order.product_price  || "—" },
      { label: "Größe",            value: order.size           || "—" },
      { label: "Farbe",            value: order.color          || "—" },
      { label: "Geschlecht",       value: order.gender         || "—" },
      { label: "Klasse",           value: `${order.class_level || ""}${order.class_letter || ""}` || "—" },
      { label: "divider" },
      { label: "Name",             value: order.customer_name  || "—" },
      { label: "E-Mail",           value: order.customer_email || "—", full: true },
      { label: "Anmerkung",        value: order.note           || "—", full: true },
      { label: "divider" },
      { label: "Bezahlt",          value: order.paid      ? "✓ Ja" : "✗ Nein" },
      { label: "Bestellt",         value: order.ordered   ? "✓ Ja" : "✗ Nein" },
      { label: "Ausgeliefert",     value: order.delivered ? "✓ Ja" : "✗ Nein" },
    ];

    grid.innerHTML = rows.map(r => {
      if (r.label === "divider") return `<hr class="detail-divider" />`;
      return `
        <div class="detail-item${r.full ? " full" : ""}">
          <span class="detail-label">${r.label}</span>
          <span class="detail-value">${r.value}</span>
        </div>`;
    }).join("");

    document.getElementById("detailOverlay").classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeDetail() {
    document.getElementById("detailOverlay").classList.remove("active");
    document.body.style.overflow = "";
  }

  document.getElementById("detailClose").addEventListener("click", closeDetail);
  document.getElementById("detailOverlay").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeDetail();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      closeDetail();
      closeConfirmModal();
    }
  });
  </script>
</body>
</html>
